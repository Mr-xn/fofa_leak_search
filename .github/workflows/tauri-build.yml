name: Tauri Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 只由这一个 job 创建 release。之前 8 个矩阵 job 各自"查不到就创建草稿"，
  # 并发下产生了多个同名草稿（v1.2.8 运行时出现 3 个，安装包被分散存放，
  # 其中一个草稿完全没有 x64 Windows 安装包）。
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Find or create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"

          # 已存在则复用（例如重跑同一个 tag），按 API 顺序取最新一个
          find_id() {
            gh api "repos/${REPO}/releases?per_page=100" \
              --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -n1
          }

          RELEASE_ID="$(find_id)"
          if [ -z "${RELEASE_ID}" ]; then
            # 用 API 创建并直接取响应里的 id。不能创建后再查列表——
            # 草稿创建后立即查询有可见性竞态（v1.2.9 首跑因此误判创建失败）
            RELEASE_ID="$(gh api "repos/${REPO}/releases" \
              -f tag_name="${TAG}" \
              -f name="FOFA Leak Search ${TAG}" \
              -f body="FOFA Leak Search Desktop Release" \
              -F draft=true \
              --jq '.id')"
          fi

          if [ -z "${RELEASE_ID}" ]; then
            echo "::error::无法为 ${TAG} 创建或找到 draft release"
            exit 1
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "使用 release id=${RELEASE_ID}（tag=${TAG}）"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
          # Legacy Linux builds on Ubuntu 22.04 (glibc 2.35).
          # Artifacts are renamed with an _ubuntu22 suffix so users can
          # distinguish them from the ubuntu-latest (glibc 2.39) packages.
          # Note: Tauri v2 requires webkit2gtk ≥ 2.38, so Ubuntu 22.04 is
          # the oldest practical build platform for these packages.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            legacy: true
          - platform: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
            legacy: true
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: msi,nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native build dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Linux ARM64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          CODENAME="$(lsb_release -cs)"
      
          sudo dpkg --add-architecture arm64
      
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
      
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Architectures:/d; /^Types: deb$/a Architectures: amd64' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
      
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse"
          } | sudo tee /etc/apt/sources.list.d/arm64.list
      
          sudo apt-get update

          GLIB_VERSION="$(apt-cache madison libglib2.0-dev:arm64 | awk 'NR==1 {print $3}')"
          if [ -z "${GLIB_VERSION}" ]; then
            echo "Unable to resolve libglib2.0-dev:arm64 version"
            exit 1
          fi
      
          sudo apt-get install -y --allow-downgrades \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            libssl-dev:arm64 \
            libglib2.0-dev:arm64=${GLIB_VERSION} \
            libglib2.0-dev-bin=${GLIB_VERSION} \
            libwebkit2gtk-4.1-dev:arm64 \
            libgtk-3-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 \
            patchelf
      
          mkdir -p ~/.cargo
      
          cat >> ~/.cargo/config.toml <<EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      
          echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> $GITHUB_ENV
          echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> $GITHUB_ENV
      
          echo 'PKG_CONFIG_ALLOW_CROSS=1' >> $GITHUB_ENV
          echo 'PKG_CONFIG_SYSROOT_DIR=/' >> $GITHUB_ENV
          echo 'PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig' >> $GITHUB_ENV
      
          echo 'OPENSSL_DIR=/usr' >> $GITHUB_ENV
          echo 'OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu' >> $GITHUB_ENV
          echo 'OPENSSL_INCLUDE_DIR=/usr/include' >> $GITHUB_ENV
          
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      # Standard build: uploads artifacts to the release created by create-release.
      # releaseId 让 tauri-action 只上传、不创建 release（tagName/releaseName 不再参与查找）；
      # tagName 仍需保留：updater 的 latest.json 用它拼接下载地址；
      # releaseDraft 必须与已存在的草稿状态一致。
      - name: Build Tauri App
        if: ${{ !matrix.legacy }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          tauriScript: npx tauri
          args: >
            --target ${{ matrix.target }}
            ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      # Legacy build: compile only, no release upload (handled by the next step).
      - name: Build Legacy Tauri App
        if: ${{ matrix.legacy }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: >
            --target ${{ matrix.target }}
            ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}

      # Rename legacy artifacts with _ubuntu22 suffix and upload to the release.
      - name: Rename and Upload Legacy Linux Artifacts
        if: ${{ matrix.legacy }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          UPLOAD_FILES=()

          for f in "${BUNDLE_DIR}"/deb/*.deb; do
            [ -f "$f" ] || continue
            NEW="${f%.deb}_ubuntu22.deb"
            mv "$f" "$NEW"
            UPLOAD_FILES+=("$NEW")
          done

          for f in "${BUNDLE_DIR}"/rpm/*.rpm; do
            [ -f "$f" ] || continue
            NEW="${f%.rpm}_ubuntu22.rpm"
            mv "$f" "$NEW"
            UPLOAD_FILES+=("$NEW")
          done

          for f in "${BUNDLE_DIR}"/appimage/*.AppImage; do
            [ -f "$f" ] || continue
            NEW="${f%.AppImage}_ubuntu22.AppImage"
            mv "$f" "$NEW"
            UPLOAD_FILES+=("$NEW")
          done

          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            # release 已由 create-release 建好（build 依赖它），这里只上传。
            # 不要重新引入 "查不到就创建"：并发下会产生同名草稿。
            gh release upload "${{ github.ref_name }}" "${UPLOAD_FILES[@]}" --clobber
          fi
